<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLinearH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E79F" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <radialGradient id="burgundyBgH" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6B1124" />
      <stop offset="70%" stop-color="#3D0612" />
      <stop offset="100%" stop-color="#1E0207" />
    </radialGradient>
  </defs>

  <!-- Circular Emblem on the Left (size 60x60, centered at 35, 35) -->
  <g transform="translate(5, 5)">
    <circle cx="30" cy="30" r="29" fill="url(#burgundyBgH)" stroke="url(#goldLinearH)" stroke-width="1.5" />
    <circle cx="30" cy="30" r="26" fill="none" stroke="url(#goldLinearH)" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.8" />
    <!-- Mini Swallow Emblem -->
    <g transform="translate(30, 30) scale(0.48)">
      <path d="M -45,15 C -30,38 30,38 45,15 C 32,28 -32,28 -45,15 Z" fill="url(#goldLinearH)" />
      <path d="M 0,-8 C -8,-22 -26,-36 -42,-34 C -34,-26 -22,-18 -12,-8 C -18,-5 -28,-3 -35,-1 C -26,3 -14,1 -4,1 Z" fill="url(#goldLinearH)" />
      <path d="M 0,-8 C 12,-26 30,-44 48,-42 C 40,-32 26,-22 14,-10 C 22,-8 34,-6 42,-2 C 32,3 18,2 4,1 Z" fill="url(#goldLinearH)" />
      <path d="M 0,-14 C 3,-19 2,-25 0,-27 C -2,-25 -3,-19 0,-14 Z" fill="url(#goldLinearH)" />
      <path d="M 0,-2 C -3,8 -8,18 -14,24 C -9,20 -5,14 0,6 C 5,14 9,20 14,24 C 8,18 3,8 0,-2 Z" fill="url(#goldLinearH)" />
      <polygon points="0,-36 2,-31 7,-29 2,-27 0,-22 -2,-27 -7,-29 -2,-31" fill="#FFF8DC" />
    </g>
  </g>

  <!-- Typography on the Right -->
  <g transform="translate(80, 0)">
    <!-- Primary Brand Title -->
    <text x="0" y="34" fill="url(#goldLinearH)" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" letter-spacing="3.5">
      BIRD'S NEST
    </text>
    <!-- Subtitle: YẾN SÀO CAO CẤP -->
    <text x="1" y="52" fill="#E6D7B8" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" letter-spacing="4.5">
      YẾN SÀO CAO CẤP
    </text>
    <!-- Subtle Gold Line Divider -->
    <line x1="1" y1="58" x2="160" y2="58" stroke="url(#goldLinearH)" stroke-width="0.75" opacity="0.6" />
  </g>
</svg>
