<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E79F" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA7C11" />
      <stop offset="75%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <radialGradient id="goldRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8B6508" />
    </radialGradient>
    <!-- Background Gradient: Deep Royal Burgundy -->
    <radialGradient id="burgundyBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6B1124" />
      <stop offset="65%" stop-color="#400713" />
      <stop offset="100%" stop-color="#24030A" />
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Shadow -->
  <circle cx="120" cy="120" r="114" fill="#150206" opacity="0.4" />

  <!-- Base Circle in Luxury Burgundy -->
  <circle cx="120" cy="120" r="112" fill="url(#burgundyBg)" stroke="url(#goldLinear)" stroke-width="3" />
  
  <!-- Outer Decorative Beaded / Dashed Ring -->
  <circle cx="120" cy="120" r="105" fill="none" stroke="url(#goldLinear)" stroke-width="1" stroke-dasharray="2 4" opacity="0.8" />
  
  <!-- Inner Ring Frame -->
  <circle cx="120" cy="120" r="99" fill="none" stroke="url(#goldLinear)" stroke-width="1.5" />

  <!-- Upper Arch Curved Text "BIRD'S NEST" -->
  <path id="textArcTop" d="M 38 120 A 82 82 0 0 1 202 120" fill="none" />
  <text fill="url(#goldLinear)" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="700" letter-spacing="4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      BIRD'S NEST
    </textPath>
  </text>

  <!-- Lower Arch Curved Text "YẾN SÀO CAO CẤP" -->
  <path id="textArcBottom" d="M 200 125 A 80 80 0 0 1 40 125" fill="none" />
  <text fill="url(#goldLinear)" font-family="'Montserrat', sans-serif" font-size="9.5" font-weight="600" letter-spacing="3.2">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      YẾN SÀO CAO CẤP
    </textPath>
  </text>

  <!-- Small Dividing Stars on sides -->
  <g fill="url(#goldLinear)">
    <polygon points="32,120 34,124 38,124 35,127 36,131 32,128 28,131 29,127 26,124 30,124" transform="scale(0.8) translate(7, 30)" />
    <polygon points="32,120 34,124 38,124 35,127 36,131 32,128 28,131 29,127 26,124 30,124" transform="scale(0.8) translate(247, 30)" />
  </g>

  <!-- Central Emblem: Soaring Swiftlet / Swallow & Nest Crescent -->
  <g transform="translate(120, 118)">
    <!-- Elegant Nest Bowl Crescent Arc -->
    <path d="M -45,15 C -30,38 30,38 45,15 C 32,28 -32,28 -45,15 Z" fill="url(#goldLinear)" filter="url(#goldGlow)" />
    <!-- Delicate Filigree Strands under the nest -->
    <path d="M -30,22 C -15,33 15,33 30,22 C 18,29 -18,29 -30,22 Z" fill="url(#goldLinear)" opacity="0.7" />
    
    <!-- Stylized Soaring Swallow / Swiftlet Wings -->
    <!-- Left Wing -->
    <path d="M 0,-8 C -8,-22 -26,-36 -42,-34 C -34,-26 -22,-18 -12,-8 C -18,-5 -28,-3 -35,-1 C -26,3 -14,1 -4,1 Z" fill="url(#goldLinear)" />
    <!-- Right Wing (Soaring Higher) -->
    <path d="M 0,-8 C 12,-26 30,-44 48,-42 C 40,-32 26,-22 14,-10 C 22,-8 34,-6 42,-2 C 32,3 18,2 4,1 Z" fill="url(#goldLinear)" />
    <!-- Bird Body & Streamlined Head -->
    <path d="M 0,-14 C 3,-19 2,-25 0,-27 C -2,-25 -3,-19 0,-14 Z" fill="url(#goldLinear)" />
    <!-- Swallow Tail (Forked) -->
    <path d="M 0,-2 C -3,8 -8,18 -14,24 C -9,20 -5,14 0,6 C 5,14 9,20 14,24 C 8,18 3,8 0,-2 Z" fill="url(#goldLinear)" />

    <!-- Center Radiance Star above swallow -->
    <polygon points="0,-36 2,-31 7,-29 2,-27 0,-22 -2,-27 -7,-29 -2,-31" fill="#FFF8DC" />
  </g>
</svg>
